name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pure-link/package-lock.json

      - name: Install dependencies
        working-directory: pure-link
        run: npm ci

      - name: Run tests
        working-directory: pure-link
        run: npm test -- --run

      - name: Validate wrangler configuration
        working-directory: pure-link
        run: npx wrangler deploy --dry-run --env=""
